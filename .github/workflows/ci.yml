name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (runtime + ibkr + app + dev)
        # `prices` (yfinance) is deliberately NOT installed: the price parsers are pure
        # and run against frozen fixtures, so CI proves they work without the unofficial
        # library being reachable (section 4.3). `app` IS installed: without Streamlit
        # every page test skips itself, the public-mode leak scan among them, and a green
        # CI would certify nothing about what the public deployment shows.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ibkr,app]"
      - name: Lint (ruff)
        run: |
          ruff --version
          ruff check .
      - name: Tests (pytest)
        # No secrets and no network: parsers run against frozen fixtures, the DB is a
        # temp SQLite file, and key-dependent ingesters skip when their keys are absent.
        # The point-in-time (section 9.4) and price-adjustment (section 9.1) tests are
        # blocking by design — a green CI is what certifies there is no look-ahead.
        run: pytest -q
