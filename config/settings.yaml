# equitydash — configuración no secreta y versionada (CLAUDE.md §10).
#
# Aquí NO va nada personal. Las tesis, los pesos objetivo y los parámetros fiscales
# viven en config/settings.local.yaml, que está gitignored y se fusiona encima de este
# archivo (deep merge). Los secretos van en config/.env.

database:
  path: equitydash.db          # relativo a la raíz del repo; DATABASE_URL lo sustituye (fase 5)

logging:
  level: INFO

app:
  # true = despliegue público: la cartera se muestra SIN importes absolutos (base 100,
  # pesos, porcentajes) y la capa fiscal no se despliega (§11). La lista de páginas
  # publicables y la regla viven en app/format.py; tests/test_public_mode.py la verifica
  # renderizando el panel entero. No hay factor de escala: ver RESEARCH.md §2.8.
  public_mode: false

# ---------------------------------------------------------------------------
# Universo — tres círculos concéntricos (§5.1)
# ---------------------------------------------------------------------------
universe:
  # 1) Referencias de mercado. NO son posiciones: alimentan los niveles 1 y 2.
  market_references:
    broad:    [SPY, RSP, QQQ, IWM]           # RSP/SPY = estrechez del rally (§2 nivel 2)
    # Los nueve SPDR sectoriales originales (dic. 1998). XLB añadido el 2026-09-23: sin él
    # la amplitud sectorial dejaba fuera a materiales. XLRE (2015) y XLC (2018) NO van
    # aquí a propósito: cambiarían el denominador con los años (panel.level2).
    sectors:  [XLK, XLU, XLP, XLF, XLE, XLV, XLY, XLI, XLB]
    assets:   [TLT, GLD]
    # DXY no se toma de un feed de precios: entra por FRED como DTWEXBGS (ver sources.fred).

  # 2) Universo de seguimiento: empresas con ficha de tesis completa (§5.2).
  #    Vive en settings.local.yaml — una empresa sin criterio de invalidación se rechaza
  #    al cargar la config (core.config.validate_theses) y en el esquema (thesis_log).
  tracked: []

# ---------------------------------------------------------------------------
# Fuentes de datos — todas gratuitas (§4). Ninguna URL hardcodeada en el código.
# ---------------------------------------------------------------------------
sources:
  fred:
    base_url: https://api.stlouisfed.org/fred
    # output_type=4 devuelve solo la publicación inicial de cada dato: es lo que permite
    # guardar ts_release honesto y evitar look-ahead (§9.4).
    output_type: 4
    series:
      - CPIAUCSL      # IPC general
      - PCEPILFE      # PCE subyacente (la métrica que mira la Fed)
      - PAYEMS        # nóminas no agrícolas
      - DFF           # fed funds efectiva
      - DTWEXBGS      # índice dólar amplio (el "DXY" del panel)
      - T10Y2Y        # pendiente 10a-2a
      - BAMLH0A0HYM2  # spread high yield (mejor detector temprano de risk-off, §2)
      # ⚠️ FRED sirve las series de índices ICE BofA (BAMLH0A0HYM2, BAMLC0A0CM) en una
      # ventana rodante de ~3 años: verificado el 2026-08-28, el histórico completo empieza
      # el 2023-08-29, y NO es un límite de point-in-time — output_type=1 devuelve lo mismo.
      # Sirve para leer el nivel 1 en vivo; no alcanza para validar el semáforo de régimen
      # contra 2008 o 2020 (fases 3-4). BAA10Y es el sustituto con histórico largo:
      # misma idea (prima de crédito), grado de inversión en vez de HY. La SERIE va desde
      # 1986, pero su point-in-time (vintages de ALFRED) solo desde 2014 — medido el
      # 2026-09-24; para 2008 no sirve con disciplina point-in-time.
      - BAA10Y        # Moody's Baa − tesoro 10a: prima de crédito con histórico largo
      - NFCI          # condiciones financieras Chicago Fed
      - VIXCLS        # VIX (volatilidad implícita a 30 días)
      # VXVCLS es el VIX3M de CBOE, servido por FRED. Verificado el 2026-09-23: existe,
      # es diario y arranca en 2007-12-04. Con él, la estructura de volatilidad de la
      # fase 3 (VIX < VIX3M normal; invertida = estrés) NO necesita raspar CBOE — una
      # fuente frágil menos (§4.3), con point-in-time de ALFRED de fábrica.
      - VXVCLS        # VIX3M — estructura de volatilidad (§8 fase 3)
      - DGS10         # tesoro 10 años
      - T10YIE        # inflación implícita 10 años
      # Liquidez neta de la Fed = balance − cuenta del Tesoro − repos inversos (§8 fase 3).
      # Las tres de la MISMA publicación semanal H.4.1: mismas unidades (millones), mismo
      # corte (miércoles) y misma publicación (jueves). ⚠️ NO se usa RRPONTSYD, la de la
      # fórmula popular: viene en MILES DE MILLONES frente a millones de las otras dos, y
      # restarla tal cual da un error ×1000 invisible mientras los repos rondaban cero
      # (hasta 2021) y enorme cuando llegaron a ~2,5 billones. Point-in-time desde 2011.
      - WALCL         # activos totales de la Fed (millones USD, semanal)
      - WTREGEN       # cuenta general del Tesoro en la Fed (millones USD, semanal)
      - WLRRAL        # repos inversos, nivel del miércoles (millones USD, semanal)

  sec:
    base_url: https://data.sec.gov
    ticker_map_url: https://www.sec.gov/files/company_tickers.json
    # La SEC bloquea sin User-Agent identificable con nombre y correo reales (§4.4).
    # Se lee de la variable de entorno SEC_USER_AGENT; sin ella, el ingester falla ruidoso.
    user_agent_env: SEC_USER_AGENT
    rate_limit_rps: 8          # margen bajo el límite del orden de 10 req/s de la SEC
    cache_dir: .cache/sec      # caché agresiva: los datos solo cambian con un filing nuevo
    cache_ttl_hours: 24        # y si la red falla, se usa la copia vencida avisando

    # Formularios que se guardan en la tabla `filings`. La versión enmendada entra sola:
    # pedir `10-K` guarda también `10-K/A`, que es justo la interesante (§9.6). Se dejan
    # fuera los Form 4 (transacciones de insiders) porque son cientos al año por empresa
    # y hoy nadie los lee; añadirlos aquí es un cambio de una línea.
    filing_forms: ["10-K", "10-Q", "8-K", "20-F", "40-F", "DEF 14A", "S-1"]
    earnings_history: 8        # cuántos anuncios pasados se guardan en `events`

    # --- Normalización de taxonomía (§8 fase 2, punto 2) -----------------------------
    #
    # Las empresas usan conceptos distintos para lo mismo, y la MISMA empresa los cambia
    # con el tiempo: MSFT reporta `Revenues` hasta ~2010 y
    # `RevenueFromContractWithCustomerExcludingAssessedTax` después de ASC 606.
    # Por eso cada métrica es una LISTA ORDENADA por preferencia, y el ingester guarda
    # además qué preferencia usó en cada periodo (serie `...:src`), para poder auditar
    # un salto raro en la serie. Si ningún concepto resuelve, el valor es None y visible
    # — nunca se estima (§12).
    #
    # kind: `duration` (flujo: se acumula en un periodo) | `instant` (saldo a una fecha).
    # unit: la unidad de `units` en companyfacts. Un hecho en otra unidad se descarta y
    #       se cuenta; mezclar unidades en una serie es la forma silenciosa de mentir.
    concepts:
      revenue:
        kind: duration
        unit: USD
        tags:
          - RevenueFromContractWithCustomerExcludingAssessedTax
          - RevenueFromContractWithCustomerIncludingAssessedTax
          - Revenues
          - SalesRevenueNet
      net_income:
        kind: duration
        unit: USD
        tags: [NetIncomeLoss, ProfitLoss]
      operating_income:
        kind: duration
        unit: USD
        tags: [OperatingIncomeLoss]
      operating_cash_flow:
        kind: duration
        unit: USD
        tags:
          - NetCashProvidedByUsedInOperatingActivities
          - NetCashProvidedByUsedInOperatingActivitiesContinuingOperations
      capex:
        kind: duration
        unit: USD
        tags:
          - PaymentsToAcquirePropertyPlantAndEquipment
          - PaymentsToAcquireProductiveAssets
      sbc:                        # el análogo de los unlocks de cripto (§2)
        kind: duration
        unit: USD
        tags: [ShareBasedCompensation, AllocatedShareBasedCompensationExpense]
      buybacks:
        kind: duration
        unit: USD
        tags: [PaymentsForRepurchaseOfCommonStock]
      # ⚠️ `average`, NO `duration`: es un promedio ponderado del periodo, no un flujo
      # que se acumule. Sumar cuatro trimestres daría 4x el número de acciones, y
      # derivar el Q4 restando (FY − Q1 − Q2 − Q3) daría un disparate — las dos cosas
      # producirían una cifra plausible a la vista. Ver transform/value_accrual.py.
      diluted_shares:             # la dilución: crecimiento del negocio vs. por acción
        kind: average
        unit: shares
        tags: [WeightedAverageNumberOfDilutedSharesOutstanding]
      issuance:                   # emisión: lo que hay que restar a la recompra bruta (§2)
        kind: duration
        unit: USD
        tags:
          - ProceedsFromIssuanceOfCommonStock
          - ProceedsFromIssuanceOrSaleOfEquity
          - ProceedsFromStockOptionsExercised
      income_tax_expense:         # para la tasa efectiva OBSERVADA, no una supuesta
        kind: duration
        unit: USD
        tags: [IncomeTaxExpenseBenefit]
      pretax_income:
        kind: duration
        unit: USD
        tags:
          - IncomeLossFromContinuingOperationsBeforeIncomeTaxesExtraordinaryItemsNoncontrollingInterest
          - IncomeLossFromContinuingOperationsBeforeIncomeTaxesMinorityInterestAndIncomeLossFromEquityMethodInvestments
      assets:
        kind: instant
        unit: USD
        tags: [Assets]
      liabilities:
        kind: instant
        unit: USD
        tags: [Liabilities]
      equity:
        kind: instant
        unit: USD
        tags: [StockholdersEquity, StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest]
      cash:
        kind: instant
        unit: USD
        tags:
          - CashAndCashEquivalentsAtCarryingValue
          - CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalents
      long_term_debt:
        kind: instant
        unit: USD
        # ConvertibleDebtNoncurrent añadido el 2026-09-23: HIMS no usa ninguno de los dos
        # primeros y su deuda a largo son convertibles. Es deuda no corriente, así que
        # cuenta como tal en el capital invertido.
        # ⚠️ Pero un convertible es ADEMÁS un instrumento de dilución: si convierte, deja
        # de ser deuda y pasa a ser acciones. Para el capital invertido tratarlo como
        # deuda es lo conservador; para §2 (captura de valor) es una pata más de la
        # dilución futura que el recuento de acciones de hoy todavía no refleja.
        # NO se incluye OperatingLeaseLiabilityNoncurrent: tratar los arrendamientos
        # operativos como deuda es una decisión discutible, y `invested_capital()` ya se
        # declara una aproximación tosca.
        tags: [LongTermDebtNoncurrent, LongTermDebt, ConvertibleDebtNoncurrent]

    # Clasificación de la duración de un hecho, en días. companyfacts mezcla trimestres
    # (3 meses) con acumulados YTD (6 y 9) y con el año (12) en el MISMO concepto, y
    # todos comparten `end`. Meter un YTD en la serie trimestral sería un error enorme y
    # perfectamente plausible a la vista. Lo que no cae en ninguna ventana se descarta y
    # se cuenta — nunca en silencio.
    # Clasificación de duraciones. `companyfacts` mezcla hechos de 3, 6, 9 y 12 meses bajo
    # el mismo concepto y compartiendo `end`; sin separarlos, un acumulado YTD entraría en
    # la serie trimestral y la serie resultante sería plausible y falsa (§2.11).
    #
    # Los 6 y 9 meses son ACUMULADOS del ejercicio, no trimestres, y se guardan como tales
    # (`:ytd2`, `:ytd3`). `transform/fundamentals.py` deriva de ellos el trimestre que la
    # empresa no presenta suelto — ver RESEARCH.md §2.21.
    #
    # Ventanas medidas sobre el flujo de caja operativo de HIMS (2026-09-23), que presenta
    # las cuatro longitudes: 81-90 · 173-181 · 265-273 · 364-365 días.
    duration_windows:
      quarter: [80, 100]
      half: [170, 195]           # acumulado de 2 trimestres
      three_quarters: [260, 285] # acumulado de 3 trimestres
      year: [350, 380]

  # Stooq quedó descartado: robots.txt = `Disallow: /` y reto JS anti-bot (§4.2, §4.3).
  yfinance:
    # 1998-12 y no 2015 desde el 2026-09-23: los ETF sectoriales existen desde el
    # 1998-12-22 y RSP desde 2003, y son la amplitud SIN sesgo de supervivencia que valida
    # el semáforo contra 2000, 2008 y 2020 (RESEARCH.md §2.26). Cada ticker empieza cuando
    # empieza: HIMS en 2019, UBER en 2019.
    history_start: "1998-12-01"   # ventana completa en cada ejecución, ver nota abajo
    currency: USD
    # Yahoo devuelve OHLC, volumen y dividendos AJUSTADOS por split, retroactivamente.
    # El ingester reconstruye el crudo antes de guardar (§9.1). `auto_adjust=False` no
    # basta: solo desactiva el ajuste por dividendos.
    #
    # La ventana se refetchea entera cada vez, no de forma incremental: un split nuevo
    # reescala todas las barras pasadas que sirve Yahoo, y solo una ventana que abarque
    # el split permite recuperar el crudo.

  # Composición histórica del S&P 500 — para la AMPLITUD del nivel 2 (§9.5).
  # Dataset `fja05680/sp500`, licencia MIT (Copyright (c) 2019-2020 Farrell J. Aultman):
  # 1996-2019 de la descarga del libro *Trading Evolved* (Andreas Clenow) y actualizado a
  # mano desde Wikipedia. Fiable desde 2001. Evaluado el 2026-09-23 (RESEARCH.md §2.24).
  sp500_membership:
    url: "https://raw.githubusercontent.com/fja05680/sp500/master/S%26P%20500%20Historical%20Components%20%26%20Changes%20(Updated).csv"
    cache_dir: .cache/universe
    cache_ttl_hours: 168          # la fuente se actualiza cada par de meses
    # Desde cuándo se bajan los cierres de los miembros. 2017 da la ventana de 200 sesiones
    # de calentamiento antes de donde la cobertura roza el 85 % (2018-2019), y deja sitio a
    # recuperar renombrados si algún día se hace (subiría el cruce a ~2018).
    price_history_start: "2017-01-01"
    batch_size: 80
    batch_pause_s: 3
    # Sesiones que la fuente devuelve casi vacías (visto: 2026-09-22 sin XOM ni KO, y
    # seguía así horas después). Se guardan como llegan, sin rellenar. Un reintento corto;
    # y solo cuenta como fallo si está entre las N últimas sesiones — una vieja que sigue
    # ahí es un defecto conocido de la fuente, y fallar cada día por él sería gritar lobo.
    hole_retry_pause_s: 5
    hole_alert_sessions: 5

  # FINRA — interés corto consolidado (nivel 2, posicionamiento). Verificado 2026-09-23:
  # API REST pública, SIN credenciales, respuesta CSV.
  finra:
    short_interest_url: https://api.finra.org/data/group/otcMarket/name/consolidatedShortInterest
    user_agent: "equitydash/0.1 (personal research)"
    request_timeout_s: 60
    page_limit: 500            # el dataset está particionado por settlementDate
    cache_dir: .cache/finra
    cache_ttl_hours: 24

    # ⚠️ EL PARÁMETRO IMPORTANTE. FINRA NO publica fecha de difusión en el dataset: trae
    # `settlementDate` (la referencia) y nada que diga cuándo se hizo público. Tampoco hay
    # dataset de calendario en la API (probado: 404). Así que `ts_release` es DERIVADO, no
    # observado, y este es el supuesto — visible y ajustable, no enterrado en el código.
    #
    # Medido sobre las 28 fechas del calendario que FINRA publica en su web (2026-09-23):
    # el rezago es de 7 días hábiles en 19 ciclos y de 8 en los otros 9. NO es constante.
    #
    # Por eso el valor por defecto es el MÁXIMO y no la mediana: un rezago corto afirmaría
    # que una cifra era pública antes de serlo, que es look-ahead (§9.4); uno largo solo
    # vuelve al panel algo conservador. Cuando una fecha derivada tiene que equivocarse,
    # tiene que equivocarse TARDE.
    publication_lag_business_days: 8

  ibkr_flex:
    base_url: https://ndcdyn.interactivebrokers.com/AccountManagement/FlexWebService
    version: 3
    # ⚠️ El host de GetStatement NO es este: SendRequest lo devuelve en <Url> y apunta a
    # gdcdyn (verificado 2026-09-16, RESEARCH.md §2.7). El cliente usa el devuelto.
    # Handshake asíncrono: el primer GetStatement puede no estar listo (§4.1). Y un fallo
    # llega con HTTP 200, con el error dentro del XML — no basta raise_for_status().
    poll_attempts: 6
    poll_base_delay_s: 3
    poll_max_delay_s: 60
    request_timeout_s: 60
    # Tolerancia de caja del cruce contra StmtFunds (el libro mayor de IBKR). Medio
    # céntimo: tanto el mayor como las ejecuciones son cifras exactas, así que cualquier
    # cosa por encima del redondeo es un desacuerdo real entre lo que parseamos y lo que
    # movió el bróker. StmtFunds se VERIFICA, no se guarda: no trae ningún hecho que no
    # estén ya en trades y cash_transactions (RESEARCH.md §2.19).
    funds_tolerance: 0.005
    # IBKR sella las ejecuciones en la zona horaria configurada del reporte, y el XML no
    # dice cuál es. Aquí es un parámetro visible y verificable en el portal, no una
    # suposición enterrada en el código (§10). Cámbialo si tu reporte usa otra zona.
    statement_timezone: America/New_York
    # Leyenda de los códigos de `notes` de una operación (RESEARCH.md §2.7). FP y RP no
    # aparecen en la página de códigos de IBKR: se documentaron aparte, y son de
    # fraccionadas, no de ejecución parcial.
    trade_codes:
      O:  Apertura
      C:  Cierre
      P:  Ejecución parcial
      FP: Fracción de acción (Fractional Portion)
      RP: Principal sin riesgo en fraccionadas (Riskless Principal)
      R:  Reinversión de dividendo
      Ca: Cancelada
      A:  Asignación
      Ex: Ejercicio
      RI: Inversión recurrente
      PI: Mejora de precio
      T:  Transferencia
      I:  Transferencia interna

# ---------------------------------------------------------------------------
# Panel — qué se muestra en cada nivel del checklist (§2). Nada de esto se
# hardcodea en el código: etiquetas, unidades y ventanas viven aquí (§10).
#
# Umbrales del semáforo: en panel.level2.regime, ESCRITOS ANTES de mirar ningún
# resultado (2026-09-24) y no retocados después — elegirlos mirando el gráfico sería
# §9.7 literal. Ver RESEARCH.md §2.27.
# ---------------------------------------------------------------------------
panel:
  # Nivel 3 — ¿sigue viva la tesis? (§2, fase 2)
  level3:
    # Coste de capital de referencia contra el que se compara el ROIC. En `null` el panel
    # muestra "no calculable": estimar un WACC necesita beta y prima de riesgo, y un
    # número inventado dentro de un cálculo que luego parece preciso es justo lo que
    # prohíbe §12. Ponlo en settings.local.yaml cuando decidas TU tasa exigida.
    hurdle_rate: null

    # Días antes de resultados dentro de los cuales §2 prohíbe abrir posición sin
    # decisión explícita. Es el análogo del unlock: evento binario con fecha conocida.
    # Umbral, así que vive aquí y no dentro de una página (§10).
    earnings_window_days: 5

  # Nivel 4 — cartera real.
  portfolio:
    # Diferencia relativa tolerada entre la valoración propia (cierres crudos de
    # yfinance) y el NAV de posiciones que reporta IBKR, comparando ambos lados en la
    # fecha del statement. Por encima: bandera visible en el panel, NUNCA un ajuste
    # automático (§9.8) — son dos medidas distintas del mismo número, y que discrepen
    # es información sobre los datos. Medido el 2026-09-17: 0,00%.
    nav_tolerance: 0.005

  # Nivel 2 — estructura de mercado (§2, fase 3).
  level2:
    # ── SEMÁFORO DE RÉGIMEN (§8 fase 3) ──────────────────────────────────────────────
    # Escrito ANTES de ver ningún resultado y NO ajustado después (§9.7). Si la
    # validación sale mal, se informa; no se retocan estos números para que salga bien.
    #
    # Cada componente vota +1 (risk-on), 0 (neutro), −1 (risk-off) o se abstiene (sin dato).
    # Dos tipos de regla, para no inventar umbrales:
    #   level  — contra un punto de referencia NATURAL, que no hay que elegir;
    #   trend  — contra su propia media de `window` sesiones, cuando no hay punto natural.
    # Agregado: pesos iguales y fijos, mayoría simple. Rojo si MÁS de la mitad de los que
    # votan dice risk-off; verde si más de la mitad dice risk-on; ámbar en otro caso. Sin
    # umbral que elegir.
    #
    # El semáforo BLOQUEA: en rojo no se compra aunque el nivel 3 sea perfecto (§2). En
    # verde no significa "compra": significa "el entorno no lo impide".
    regime:
      window: 200                  # la misma ventana convencional de la amplitud
      min_window_fraction: 0.95    # la lección del hueco del 2026-09-22 (§2.26)
      # Zona muerta de las reglas de tendencia: dentro de ±k desviaciones típicas de su
      # media, el componente se declara neutro. UN valor para todos: por componente serían
      # ocho parámetros libres más (§9.7).
      trend_dead_zone_sd: 0.25
      max_staleness_days: 30       # dato más viejo que esto → el componente se abstiene
      min_components: 4            # menos de la mitad votando → "insuficiente", sin veredicto
      components:
        - key: net_liquidity
          label: Liquidez neta de la Fed
          source: net_liquidity    # WALCL − WTREGEN − WLRRAL
          kind: trend
          off_when: below          # contrayéndose
        - key: nfci
          label: Condiciones financieras (NFCI)
          series: NFCI
          kind: level
          off_when: above
          reference: 0.0           # 0 = condiciones medias, por construcción del índice
          dead_zone: 0.10
        - key: credit
          label: Prima de crédito Baa − 10a
          series: BAA10Y           # no el HY: solo tiene ~3 años de historia
          kind: trend
          off_when: above          # ensanchándose
        - key: dollar
          label: Dólar amplio
          series: DTWEXBGS
          kind: trend
          off_when: above          # fortaleciéndose: endurece las condiciones globales
        - key: curve
          label: Curva 10a − 2a
          series: T10Y2Y
          kind: level
          off_when: below
          reference: 0.0           # la inversión
          dead_zone: 0.10
        - key: breadth
          label: Amplitud sectorial
          source: sector_breadth   # la de empresas solo es fiable desde 2019 (§2.25)
          kind: level
          off_when: below
          reference: 0.5           # la mayoría
          dead_zone: 0.10          # 4 o 5 de 9 sectores = neutro
        - key: equal_weight
          label: Equiponderado frente a capitalización (RSP/SPY)
          source: equal_weight
          kind: trend
          off_when: below          # estrechándose
        - key: volatility
          label: Estructura de volatilidad (VIX / VIX3M)
          source: vix_term
          kind: level
          off_when: above
          reference: 1.0           # la inversión de la curva de volatilidad
          dead_zone: 0.05

    # Medidas de amplitud construidas con ETF. Sin sesgo de supervivencia por construcción:
    # el precio de un ETF ya incluye a los miembros que tenía en cada momento, también a los
    # que luego quebraron. Son las que entran en la VALIDACIÓN HISTÓRICA del semáforo; la
    # amplitud por empresas (breadth, abajo) solo es fiable desde 2019 y queda para leer en
    # vivo. Decidido por el usuario el 2026-09-23.
    sector_breadth:
      window: 200
      min_window_fraction: 0.95   # ver breadth.min_window_fraction
      # Conjunto FIJO de los nueve sectores originales, para que el denominador no cambie
      # en 25 años de historia.
      sectors: [XLB, XLE, XLF, XLI, XLK, XLP, XLU, XLV, XLY]
    equal_weight:
      equal: RSP                  # las 500 con el mismo peso (desde 2003-05-01)
      cap: SPY                    # ponderado por capitalización
    rotation:
      defensive: [XLU, XLP]       # servicios públicos, consumo básico
      cyclical: [XLK, XLY]        # tecnología, consumo discrecional
    breadth:
      window: 200                 # sesiones de la media: ~un año bursátil, la referencia clásica
      # Fracción de la ventana que debe tener cierre real para que exista la media. Con el
      # 100 %, UN día vacío en la fuente anulaba la media 200 sesiones: el 2026-09-23 la
      # amplitud descansaba en 60 de 503 miembros y la cobertura decía 100 %. Descubierto
      # en la primera ejecución real.
      min_window_fraction: 0.95
      # Cobertura mínima para que una lectura de amplitud se presente como del índice: la
      # fracción de miembros de ESE día sobre la que descansa el cálculo (con precio Y con
      # media calculable). Por debajo, el valor existe pero
      # se marca. Elegido por el usuario el 2026-09-23. Medido: 84,2 % a mediados de 2019,
      # 86,1 % a principios de 2020 — con 0,85 la serie es utilizable desde ~finales de 2019.
      # ⚠️ La cobertura DECAE con el tiempo (yfinance borra a los que salen de bolsa), así
      # que ese cruce se mueve hacia delante, nunca hacia atrás.
      coverage_threshold: 0.85

  level1:
    lookback_days: 30          # ventana de la columna "cambio" de la tabla macro
    readings:
      - series_id: BAMLH0A0HYM2
        label: Spread HY (OAS)
        unit: pp
        note: histórico solo desde 2023-08 — ventana rodante de FRED por licencia ICE
      - series_id: BAA10Y
        label: Prima crédito Baa − 10a
        unit: pp
        note: sustituto con histórico largo del spread HY (desde 1986)
      - series_id: T10Y2Y
        label: Curva 10a − 2a
        unit: pp
        note: negativo = curva invertida
      - series_id: NFCI
        label: Condiciones financieras (NFCI)
        unit: índice
        note: semanal; negativo = condiciones laxas
      - series_id: DTWEXBGS
        label: Dólar amplio (DXY del panel)
        unit: índice
        note: semanal
      - series_id: VIXCLS
        label: VIX
        unit: pts
        note: FRED arrastra el cierre anterior en festivos de mercado
      - series_id: DGS10
        label: Tesoro 10 años
        unit: "%"
        note: null
      - series_id: T10YIE
        label: Inflación implícita 10a
        unit: pp
        note: null
      - series_id: DFF
        label: Fed funds efectiva
        unit: "%"
        note: null
      - series_id: CPIAUCSL
        label: IPC general (nivel)
        unit: índice
        note: se publica con ~6 semanas de rezago
      - series_id: PCEPILFE
        label: PCE subyacente (nivel)
        unit: índice
        note: la métrica que mira la Fed; ~8 semanas de rezago
      - series_id: PAYEMS
        label: Nóminas no agrícolas
        unit: miles
        note: se revisa; el panel muestra la versión vigente en cada fecha

    # Gráficas. Series de la MISMA unidad en cada una: dos escalas en un mismo eje
    # es la forma más común de mentir con una gráfica.
    charts:
      - title: Prima de crédito — el detector temprano de risk-off
        unit: pp
        series: [BAA10Y, BAMLH0A0HYM2]
        zero_rule: false
      - title: Curva 10a − 2a
        unit: pp
        series: [T10Y2Y]
        zero_rule: true        # el cruce por cero es el hecho, no un umbral elegido

