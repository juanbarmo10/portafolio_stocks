# equitydash — configuración no secreta y versionada (CLAUDE.md §10).
#
# Aquí NO va nada personal. Las tesis, los pesos objetivo y los parámetros fiscales
# viven en config/settings.local.yaml, que está gitignored y se fusiona encima de este
# archivo (deep merge). Los secretos van en config/.env.

database:
  path: equitydash.db          # relativo a la raíz del repo; DATABASE_URL lo sustituye (fase 5)

logging:
  level: INFO

app:
  public_mode: false           # true oculta cuenta real (nivel 4) y capa fiscal (§11)

# ---------------------------------------------------------------------------
# Universo — tres círculos concéntricos (§5.1)
# ---------------------------------------------------------------------------
universe:
  # 1) Referencias de mercado. NO son posiciones: alimentan los niveles 1 y 2.
  market_references:
    broad:    [SPY, RSP, QQQ, IWM]           # RSP/SPY = estrechez del rally (§2 nivel 2)
    sectors:  [XLK, XLU, XLP, XLF, XLE, XLV, XLY, XLI]
    assets:   [TLT, GLD]
    # DXY no se toma de un feed de precios: entra por FRED como DTWEXBGS (ver sources.fred).

  # 2) Universo de seguimiento: empresas con ficha de tesis completa (§5.2).
  #    Vive en settings.local.yaml — una empresa sin criterio de invalidación se rechaza
  #    al cargar la config (core.config.validate_theses) y en el esquema (thesis_log).
  tracked: []

# ---------------------------------------------------------------------------
# Fuentes de datos — todas gratuitas (§4). Ninguna URL hardcodeada en el código.
# ---------------------------------------------------------------------------
sources:
  fred:
    base_url: https://api.stlouisfed.org/fred
    # output_type=4 devuelve solo la publicación inicial de cada dato: es lo que permite
    # guardar ts_release honesto y evitar look-ahead (§9.4).
    output_type: 4
    series:
      - CPIAUCSL      # IPC general
      - PCEPILFE      # PCE subyacente (la métrica que mira la Fed)
      - PAYEMS        # nóminas no agrícolas
      - DFF           # fed funds efectiva
      - DTWEXBGS      # índice dólar amplio (el "DXY" del panel)
      - T10Y2Y        # pendiente 10a-2a
      - BAMLH0A0HYM2  # spread high yield (mejor detector temprano de risk-off, §2)
      # ⚠️ FRED sirve las series de índices ICE BofA (BAMLH0A0HYM2, BAMLC0A0CM) en una
      # ventana rodante de ~3 años: verificado el 2026-08-28, el histórico completo empieza
      # el 2023-08-29, y NO es un límite de point-in-time — output_type=1 devuelve lo mismo.
      # Sirve para leer el nivel 1 en vivo; no alcanza para validar el semáforo de régimen
      # contra 2008 o 2020 (fases 3-4). BAA10Y es el sustituto con histórico largo:
      # misma idea (prima de crédito), grado de inversión en vez de HY, desde 1986.
      - BAA10Y        # Moody's Baa − tesoro 10a: prima de crédito con histórico largo
      - NFCI          # condiciones financieras Chicago Fed
      - VIXCLS        # VIX
      - DGS10         # tesoro 10 años
      - T10YIE        # inflación implícita 10 años

  sec:
    base_url: https://data.sec.gov
    ticker_map_url: https://www.sec.gov/files/company_tickers.json
    # La SEC bloquea sin User-Agent identificable con nombre y correo reales (§4.4).
    # Se lee de la variable de entorno SEC_USER_AGENT; sin ella, el ingester falla ruidoso.
    user_agent_env: SEC_USER_AGENT
    rate_limit_rps: 8          # margen bajo el límite del orden de 10 req/s de la SEC
    cache_dir: .cache/sec      # caché agresiva: los datos solo cambian con un filing nuevo

  # Stooq quedó descartado: robots.txt = `Disallow: /` y reto JS anti-bot (§4.2, §4.3).
  yfinance:
    history_start: "2015-01-01"   # ventana completa en cada ejecución, ver nota abajo
    currency: USD
    # Yahoo devuelve OHLC, volumen y dividendos AJUSTADOS por split, retroactivamente.
    # El ingester reconstruye el crudo antes de guardar (§9.1). `auto_adjust=False` no
    # basta: solo desactiva el ajuste por dividendos.
    #
    # La ventana se refetchea entera cada vez, no de forma incremental: un split nuevo
    # reescala todas las barras pasadas que sirve Yahoo, y solo una ventana que abarque
    # el split permite recuperar el crudo.

  ibkr_flex:
    base_url: https://ndcdyn.interactivebrokers.com/AccountManagement/FlexWebService
    version: 3
    # Handshake asíncrono: el primer GetStatement puede no estar listo (§4.1).
    poll_attempts: 6
    poll_base_delay_s: 3

# ---------------------------------------------------------------------------
# Panel — qué se muestra en cada nivel del checklist (§2). Nada de esto se
# hardcodea en el código: etiquetas, unidades y ventanas viven aquí (§10).
#
# OJO: aquí NO hay umbrales de semáforo. Clasificar el régimen es la fase 3, con
# pesos iguales y fijos y voto visible por componente. Poner umbrales ahora sería
# elegirlos mirando el gráfico, que es §9.7 literal.
# ---------------------------------------------------------------------------
panel:
  level1:
    lookback_days: 30          # ventana de la columna "cambio" de la tabla macro
    readings:
      - series_id: BAMLH0A0HYM2
        label: Spread HY (OAS)
        unit: pp
        note: histórico solo desde 2023-08 — ventana rodante de FRED por licencia ICE
      - series_id: BAA10Y
        label: Prima crédito Baa − 10a
        unit: pp
        note: sustituto con histórico largo del spread HY (desde 1986)
      - series_id: T10Y2Y
        label: Curva 10a − 2a
        unit: pp
        note: negativo = curva invertida
      - series_id: NFCI
        label: Condiciones financieras (NFCI)
        unit: índice
        note: semanal; negativo = condiciones laxas
      - series_id: DTWEXBGS
        label: Dólar amplio (DXY del panel)
        unit: índice
        note: semanal
      - series_id: VIXCLS
        label: VIX
        unit: pts
        note: FRED arrastra el cierre anterior en festivos de mercado
      - series_id: DGS10
        label: Tesoro 10 años
        unit: "%"
        note: null
      - series_id: T10YIE
        label: Inflación implícita 10a
        unit: pp
        note: null
      - series_id: DFF
        label: Fed funds efectiva
        unit: "%"
        note: null
      - series_id: CPIAUCSL
        label: IPC general (nivel)
        unit: índice
        note: se publica con ~6 semanas de rezago
      - series_id: PCEPILFE
        label: PCE subyacente (nivel)
        unit: índice
        note: la métrica que mira la Fed; ~8 semanas de rezago
      - series_id: PAYEMS
        label: Nóminas no agrícolas
        unit: miles
        note: se revisa; el panel muestra la versión vigente en cada fecha

    # Gráficas. Series de la MISMA unidad en cada una: dos escalas en un mismo eje
    # es la forma más común de mentir con una gráfica.
    charts:
      - title: Prima de crédito — el detector temprano de risk-off
        unit: pp
        series: [BAA10Y, BAMLH0A0HYM2]
        zero_rule: false
      - title: Curva 10a − 2a
        unit: pp
        series: [T10Y2Y]
        zero_rule: true        # el cruce por cero es el hecho, no un umbral elegido

# ---------------------------------------------------------------------------
# Ingesta — política común de reintentos (ingest/base.py)
# ---------------------------------------------------------------------------
ingest:
  retry:
    attempts: 4
    base_delay_s: 1.0
    max_delay_s: 30.0
